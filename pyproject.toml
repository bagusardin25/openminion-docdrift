[project]
name = "doctwin"
version = "0.1.0"
description = "OpenMinion agents that keep translated docs a faithful, up-to-date twin of the source (DocTwin), validated by DocDrift."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "openminion>=0.1.8,<0.2",
    "pydantic>=2",
]

[project.scripts]
doctwin = "doctwin.cli:main"
docdrift = "docdrift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doctwin", "src/docdrift"]

[dependency-groups]
dev = ["pytest>=8"]
